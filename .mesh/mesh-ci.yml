pipeline:
  name: chat

on:
  push:
    branches: [main]
  manual: true

runner:
  labels: []
  fallback: any

jobs:
  # Built-in: mesh builds the 'test' stage, then the image in buildkitd,
  # pushes it, and keeps its digest.
  build:
    uses: image
    with:
      test_target: test

  # Built-in: mesh pins the digest from 'build' in mesh-gitops. No shell, no token.
  deploy:
    uses: gitops
    depends_on: [build]
    on:
      push:
        branches: [main]
    with:
      repo: mesh-gitops
      image: build
      manifest: apps/chat/deployment.yaml
      image_pattern: registry.local:5000/chat-web
